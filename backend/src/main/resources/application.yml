spring:
  application:
    name: clinica
  
  # Configuração do banco de dados PostgreSQL
  datasource:
    url: jdbc:postgresql://localhost:5432/clinica
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  
  # Configuração do JPA/Hibernate
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  # Configuração do Flyway
  flyway:
    url: jdbc:postgresql://localhost:5433/clinica
    user: postgres
    password: postgres
    baseline-on-migrate: true
    locations: classpath:db/migration

# Configurações de segurança da aplicação
clinica:
  security:
    # Salt para criptografia de senhas com BCrypt
    password-salt: "clinica-youx-salt-2024"
    # Força do BCrypt (4-31, recomendado: 10-12)
    bcrypt-strength: 12
  jwt:
    # Chave secreta para assinatura dos tokens JWT (em produção, usar uma chave mais robusta)
    secret: "clinica-youx-jwt-secret-key-2024-muito-secreta-e-longa"
    # Expiração do token em millisegundos (24 horas = 86400000)
    expiration: 2400
    # Issuer do token
    issuer: "clinica-youx"
