spring:
  application:
    name: clinica
  
  # Configuração do banco de dados H2 (em memória para desenvolvimento)
  datasource:
    url: jdbc:h2:mem:clinica;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver
  
  # Configuração do JPA/Hibernate para H2
  jpa:
    hibernate:
      ddl-auto: create-drop  # Cria e dropa tabelas automaticamente
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: true
  
  # Console H2 para desenvolvimento (acessível em http://localhost:8080/h2-console)
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
  
  # Flyway desabilitado para desenvolvimento com H2
  flyway:
    enabled: false

# Configurações de segurança da aplicação
clinica:
  security:
    # Salt para criptografia de senhas com BCrypt
    password-salt: "clinica-youx-salt-2024"
    # Força do BCrypt (4-31, recomendado: 10-12)
    bcrypt-strength: 12
  jwt:
    # Chave secreta para assinatura dos tokens JWT (em produção, usar uma chave mais robusta)
    secret: "clinica-youx-jwt-secret-key-2024-muito-secreta-e-longa"
    # Expiração do token em millisegundos (24 horas = 86400000)
    expiration: 86400000
    # Issuer do token
    issuer: "clinica-youx"
